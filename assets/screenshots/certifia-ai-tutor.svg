<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="tutor-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e18" />
      <stop offset="100%" stop-color="#0f131d" />
    </linearGradient>
    <filter id="tut-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#tutor-bg)" />

  <!-- Window Header Bar -->
  <rect x="0" y="0" width="1280" height="42" fill="#070a12" stroke="#1c1f2a" stroke-width="1" />
  <circle cx="24" cy="21" r="6" fill="#ef4444" />
  <circle cx="44" cy="21" r="6" fill="#eab308" />
  <circle cx="64" cy="21" r="6" fill="#22c55e" />
  <text x="640" y="26" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">certifia.app • Tuteur Pédagogique IA • Calibré sur les Syllabi Officiels</text>

  <!-- Left Sidebar -->
  <rect x="0" y="42" width="220" height="678" fill="#0c101a" stroke="#1c1f2a" stroke-width="1" />
  <text x="24" y="80" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="18">Certif<tspan fill="#3b82f6">IA</tspan></text>
  <text x="24" y="96" fill="#64748b" font-family="monospace" font-size="9">CLOUD AI CERTIF</text>

  <rect x="12" y="120" width="196" height="36" rx="10" fill="transparent" />
  <text x="26" y="143" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">🏠 Today</text>
  <rect x="12" y="160" width="196" height="36" rx="10" fill="transparent" />
  <text x="26" y="183" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">🧭 Catalog</text>
  <text x="20" y="224" fill="#475569" font-family="monospace" font-size="10" font-weight="bold">3. LEARNING</text>
  <text x="26" y="250" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">✅ Quizzes &amp; MCQs</text>
  <text x="26" y="286" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">🎴 Flashcards</text>
  <text x="26" y="322" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">⏱️ Mock Exam</text>
  
  <text x="20" y="365" fill="#475569" font-family="monospace" font-size="10" font-weight="bold">5. AI ASSISTANT</text>
  <rect x="12" y="380" width="196" height="36" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
  <text x="26" y="403" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">🤖 AI Assistant</text>
  <rect x="145" y="388" width="55" height="18" rx="6" fill="#3b82f6" fill-opacity="0.2" />
  <text x="172" y="401" fill="#60a5fa" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">Tuteur</text>

  <!-- Top Bar -->
  <rect x="220" y="42" width="1060" height="54" fill="#0d111c" stroke="#1c1f2a" stroke-width="1" />
  <text x="245" y="74" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Home &gt; AI Assistant &gt; <tspan fill="#ffffff" font-weight="bold">Pedagogical Tutor</tspan></text>
  <rect x="1000" y="54" width="140" height="30" rx="8" fill="#10b981" fill-opacity="0.15" />
  <text x="1070" y="73" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">⚡ Rétention : +84%</text>

  <!-- Main 2-Column Tutor Layout -->
  <!-- Left Column: Syllabus topics selector (4 cols) -->
  <rect x="245" y="115" width="310" height="580" rx="18" fill="#131826" stroke="#252b3b" stroke-width="1" />
  <text x="265" y="145" fill="#94a3b8" font-family="monospace" font-size="10" font-weight="bold">NOTIONS AU PROGRAMME (AI-102)</text>
  
  <rect x="260" y="160" width="280" height="42" rx="10" fill="#1e273a" stroke="#3b82f6" stroke-width="1.5" />
  <text x="275" y="185" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">RAG &amp; Recherche Hybride Vectorielle</text>

  <rect x="260" y="210" width="280" height="42" rx="10" fill="#0e121d" />
  <text x="275" y="235" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Content Safety &amp; Regex Blocklists</text>

  <rect x="260" y="260" width="280" height="42" rx="10" fill="#0e121d" />
  <text x="275" y="285" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Azure AI Search Semantic Ranker</text>

  <rect x="260" y="310" width="280" height="42" rx="10" fill="#0e121d" />
  <text x="275" y="335" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Fine-Tuning LoRA vs In-Context</text>

  <rect x="260" y="360" width="280" height="42" rx="10" fill="#0e121d" />
  <text x="275" y="385" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Document Intelligence &amp; Prebuilts</text>

  <!-- Methodology Card -->
  <rect x="260" y="440" width="280" height="150" rx="14" fill="#101827" stroke="#3b82f6" stroke-opacity="0.3" />
  <text x="275" y="468" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">✨ Méthode Socratique CertifIA</text>
  <text x="275" y="492" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Le tuteur ne donne pas de réponses pré-mâchées.</text>
  <text x="275" y="510" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Il vous guide pas à pas vers la compréhension</text>
  <text x="275" y="528" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">des contraintes de latence, coût et précision.</text>

  <!-- Right Column: Interactive Chat & Diagnostic Canvas (8 cols) -->
  <g filter="url(#tut-shadow)">
    <rect x="575" y="115" width="665" height="580" rx="18" fill="#131826" stroke="#252b3b" stroke-width="1" />
    
    <!-- Tab Bar -->
    <rect x="595" y="135" width="130" height="32" rx="8" fill="#2563eb" />
    <text x="660" y="155" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">📖 Explication pas-à-pas</text>

    <rect x="735" y="135" width="130" height="32" rx="8" fill="#141926" stroke="#252b3b" />
    <text x="800" y="155" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">⚠️ Pièges d'Examen</text>

    <rect x="875" y="135" width="140" height="32" rx="8" fill="#141926" stroke="#252b3b" />
    <text x="945" y="155" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">🧠 Fiche Mnémotechnique</text>

    <!-- Chat Message: Learner -->
    <rect x="800" y="185" width="420" height="65" rx="14" fill="#1e3a8a" fill-opacity="0.5" stroke="#3b82f6" stroke-width="1" />
    <text x="820" y="210" fill="#bfdbfe" font-family="system-ui, sans-serif" font-size="12">« Pourquoi le Semantic Ranker est-il obligatoire si</text>
    <text x="820" y="230" fill="#bfdbfe" font-family="system-ui, sans-serif" font-size="12">j'ai déjà fait une recherche vectorielle cosine ? »</text>

    <!-- Chat Message: AI Tutor -->
    <rect x="595" y="265" width="580" height="230" rx="16" fill="#0f1422" stroke="#252c40" stroke-width="1" />
    <circle cx="625" cy="295" r="14" fill="#2563eb" />
    <text x="625" y="300" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">🤖</text>
    <text x="650" y="295" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Tuteur Pédagogique CertifIA</text>
    <text x="650" y="310" fill="#64748b" font-family="monospace" font-size="10">Calibré sur Azure AI-102 Official Blueprint</text>
    
    <text x="615" y="340" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Excellente question d'architecture ! La recherche vectorielle HNSW sélectionne les 50 documents</text>
    <text x="615" y="360" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">les plus proches dans l'espace latent, mais sans comprendre la structure grammaticale profonde.</text>
    <text x="615" y="390" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Le Semantic Ranker exécute un modèle cross-encoder Transformer (Turing) :</text>
    <text x="615" y="412" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• Il analyse conjointement la requête et chaque document candidat (contrairement aux bi-encoders).</text>
    <text x="615" y="432" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• Il extrait les snippets les plus pertinents et génère un score L2 reranké de 0 à 4.0.</text>
    <text x="615" y="452" fill="#34d399" font-family="system-ui, sans-serif" font-size="12">• Résultat : le Top-3 envoyé au prompt LLM contient 92% d'exactitude factuelle en plus.</text>

    <!-- Interactive Prompt Input Bar -->
    <rect x="595" y="520" width="625" height="50" rx="14" fill="#0a0d16" stroke="#252b3b" stroke-width="1.5" />
    <text x="615" y="550" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Posez une question technique, demandez un piège d'examen ou un exemple de code...</text>
    <rect x="1150" y="528" width="60" height="34" rx="8" fill="#2563eb" />
    <text x="1180" y="549" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">→</text>

    <text x="595" y="605" fill="#64748b" font-family="monospace" font-size="10">Suggestions : [Montre un piège de scoring BM25 vs Vectoriel] • [Différence LoRA vs QLoRA]</text>
  </g>
</svg>
