<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e18" />
      <stop offset="50%" stop-color="#141926" />
      <stop offset="100%" stop-color="#0f131d" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle with border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg-grad)" stroke="#262a35" stroke-width="8" />
  
  <!-- Outer orbital ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#2563eb" stroke-opacity="0.2" stroke-width="4" stroke-dasharray="12 12" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#accent-grad)" stroke-opacity="0.4" stroke-width="2" />

  <!-- Background ambient glow -->
  <circle cx="256" cy="256" r="90" fill="#4f46e5" fill-opacity="0.18" filter="url(#glow)" />

  <!-- Central Cloud & Neural Network Emblem -->
  <!-- Cloud Contour -->
  <path d="M190 320 H330 C363 320 390 293 390 260 C390 230 368 205 338 201 C332 156 294 122 248 122 C210 122 177 146 164 182 C134 189 112 216 112 248 C112 288 147 320 190 320 Z" 
        fill="#171b26" 
        stroke="url(#accent-grad)" 
        stroke-width="12" 
        stroke-linejoin="round" />

  <!-- Neural nodes inside cloud -->
  <!-- Center Node -->
  <circle cx="256" cy="220" r="14" fill="#38bdf8" filter="url(#glow)" />
  <!-- Left Node -->
  <circle cx="180" cy="250" r="10" fill="#818cf8" />
  <!-- Right Node -->
  <circle cx="332" cy="250" r="10" fill="#a855f7" />
  <!-- Top Left Node -->
  <circle cx="215" cy="180" r="8" fill="#22d3ee" />
  <!-- Top Right Node -->
  <circle cx="295" cy="180" r="8" fill="#c084fc" />

  <!-- Connections -->
  <line x1="256" y1="220" x2="180" y2="250" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.7" />
  <line x1="256" y1="220" x2="332" y2="250" stroke="#a855f7" stroke-width="4" stroke-opacity="0.7" />
  <line x1="256" y1="220" x2="215" y2="180" stroke="#22d3ee" stroke-width="3" stroke-opacity="0.7" />
  <line x1="256" y1="220" x2="295" y2="180" stroke="#c084fc" stroke-width="3" stroke-opacity="0.7" />
  <line x1="180" y1="250" x2="215" y2="180" stroke="#818cf8" stroke-width="3" stroke-opacity="0.5" />
  <line x1="332" y1="250" x2="295" y2="180" stroke="#a855f7" stroke-width="3" stroke-opacity="0.5" />

  <!-- Certification Ribbon / Shield Base Checkmark -->
  <path d="M200 375 L242 415 L320 335" 
        fill="none" 
        stroke="#4edea3" 
        stroke-width="14" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow)" />

  <!-- AI Sparkle 4-point Stars -->
  <path d="M380 130 Q380 150 400 150 Q380 150 380 170 Q380 150 360 150 Q380 150 380 130 Z" fill="#38bdf8" />
  <path d="M130 330 Q130 345 145 345 Q130 345 130 360 Q130 345 115 345 Q130 345 130 330 Z" fill="#a855f7" />
</svg>
