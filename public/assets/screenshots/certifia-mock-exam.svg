  <rect x="1100" y="125" width="115" height="28" rx="6" fill="#1e293b" />
  <text x="1157" y="143" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">🚩 Marquer (Review)</text>

  <!-- Exam Scenario Body -->
  <g filter="url(#ex-shadow)">
    <rect x="250" y="180" width="985" height="495" rx="18" fill="#131724" stroke="#252b3b" stroke-width="1" />
    
    <text x="280" y="220" fill="#60a5fa" font-family="monospace" font-size="11" font-weight="bold">QUESTION 24 SUR 50 • ÉVALUATION D'ARCHITECTURE MULTI-RÉPONSE</text>
    <text x="280" y="250" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">Une chaîne d'hôpitaux souhaite anonymiser 50 000 dossiers médicaux numérisés (PDF &amp; scans TIFF)</text>
    <text x="280" y="274" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">contenant des données sensibles PII/PHI (Noms, Numéros de sécurité sociale, diagnostics manuscrits).</text>
    <text x="280" y="294" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Quelles solutions Azure AI devez-vous enchaîner pour respecter la norme HIPAA au moindre coût ?</text>

    <!-- Options Selection -->
    <rect x="280" y="325" width="925" height="52" rx="10" fill="#1e2538" stroke="#3b82f6" stroke-width="1.5" />
    <rect x="298" y="341" width="20" height="20" rx="4" fill="#2563eb" />
    <text x="308" y="355" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">✓</text>
    <text x="330" y="356" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Étape 1 : Azure AI Document Intelligence (modèle Read OCR pour extraction textuelle et manuscrite).</text>

    <rect x="280" y="390" width="925" height="52" rx="10" fill="#1e2538" stroke="#3b82f6" stroke-width="1.5" />
    <rect x="298" y="406" width="20" height="20" rx="4" fill="#2563eb" />
    <text x="308" y="420" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">✓</text>
    <text x="330" y="421" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Étape 2 : Azure AI Language (fonctionnalité native PII &amp; PHI Redaction pour masquer les identifiants).</text>

    <rect x="280" y="455" width="925" height="52" rx="10" fill="#0c101a" stroke="#252b3b" stroke-width="1" />
    <rect x="298" y="471" width="20" height="20" rx="4" fill="#1e2433" />
    <text x="330" y="486" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Entraîner un modèle Custom Classification Azure AutoML avec 10 000 exemples labellisés manuellement.</text>

    <rect x="280" y="520" width="925" height="52" rx="10" fill="#0c101a" stroke="#252b3b" stroke-width="1" />
    <rect x="298" y="536" width="20" height="20" rx="4" fill="#1e2433" />
    <text x="330" y="551" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Exporter les scans vers Azure Blob Storage et exécuter un script Python avec Tesseract open-source.</text>

