  <text x="26" y="183" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">🧭 Catalog</text>
  <text x="20" y="224" fill="#475569" font-family="monospace" font-size="10" font-weight="bold">3. LEARNING</text>
  <text x="26" y="250" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">✅ Quizzes &amp; MCQs</text>
  <text x="26" y="286" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">🎴 Flashcards (SM-2)</text>

  <rect x="12" y="306" width="196" height="36" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
  <text x="26" y="329" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">⏱️ Mock Exam</text>
  <rect x="145" y="314" width="55" height="18" rx="6" fill="#f59e0b" fill-opacity="0.2" />
  <text x="172" y="327" fill="#fcd34d" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">Chrono</text>

  <text x="26" y="370" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">📖 AI Glossary</text>

