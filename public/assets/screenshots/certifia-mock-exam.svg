  <rect x="1055" y="52" width="100" height="34" rx="10" fill="#dc2626" />
  <text x="1105" y="73" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Terminer</text>

