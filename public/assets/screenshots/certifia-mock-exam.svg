  <text x="245" y="74" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">AI-102 : Designing and Implementing a Microsoft Azure AI Solution</text>
  
  <!-- Live Countdown Timer -->
  <rect x="880" y="52" width="160" height="34" rx="10" fill="#451a03" stroke="#f59e0b" stroke-width="1.5" />
  <circle cx="900" cy="69" r="6" fill="#ef4444" />
  <text x="918" y="74" fill="#ffffff" font-family="monospace" font-size="14" font-weight="bold">01:18:42</text>
