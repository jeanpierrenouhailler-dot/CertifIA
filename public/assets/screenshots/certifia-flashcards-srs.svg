<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="fc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e18" />
      <stop offset="100%" stop-color="#0f131d" />
    </linearGradient>
    <linearGradient id="card-surface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161c2b" />
      <stop offset="100%" stop-color="#111622" />
    </linearGradient>
    <filter id="fc-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#fc-bg)" />

  <!-- Window Header Bar -->
  <rect x="0" y="0" width="1280" height="42" fill="#070a12" stroke="#1c1f2a" stroke-width="1" />
  <circle cx="24" cy="21" r="6" fill="#ef4444" />
  <circle cx="44" cy="21" r="6" fill="#eab308" />
  <circle cx="64" cy="21" r="6" fill="#22c55e" />
  <text x="640" y="26" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">certifia.app • Fiches Mémo &amp; Algorithme SM-2 / FSRS (2 800 Cartes)</text>

  <!-- Left Sidebar -->
  <rect x="0" y="42" width="220" height="678" fill="#0c101a" stroke="#1c1f2a" stroke-width="1" />
  <text x="24" y="80" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="18">Certif<tspan fill="#3b82f6">IA</tspan></text>
  <text x="24" y="96" fill="#64748b" font-family="monospace" font-size="9">CLOUD AI CERTIF</text>

  <rect x="12" y="120" width="196" height="36" rx="10" fill="transparent" />
  <text x="26" y="143" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">🏠 Today</text>
  <rect x="12" y="160" width="196" height="36" rx="10" fill="transparent" />
  <text x="26" y="183" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">🧭 Catalog</text>
  <text x="20" y="224" fill="#475569" font-family="monospace" font-size="10" font-weight="bold">3. LEARNING</text>
  <text x="26" y="250" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">✅ Quizzes &amp; MCQs</text>

  <rect x="12" y="270" width="196" height="36" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
  <text x="26" y="293" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">🎴 Flashcards</text>
  <rect x="150" y="278" width="46" height="18" rx="6" fill="#3b82f6" fill-opacity="0.2" />
  <text x="173" y="291" fill="#60a5fa" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">2 800</text>

  <text x="26" y="334" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">⏱️ Mock Exam</text>
  <text x="26" y="370" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">📖 AI Glossary</text>

  <!-- Top Bar -->
  <rect x="220" y="42" width="1060" height="54" fill="#0d111c" stroke="#1c1f2a" stroke-width="1" />
  <text x="245" y="74" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Home &gt; Learning &gt; <tspan fill="#ffffff" font-weight="bold">Flashcards (SM-2 Spaced Repetition)</tspan></text>
  <!-- Cert Selector Buttons -->
  <rect x="680" y="54" width="90" height="30" rx="8" fill="#2563eb" />
  <text x="725" y="73" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">AI-102 (1000)</text>
  <rect x="780" y="54" width="90" height="30" rx="8" fill="#141824" />
  <text x="825" y="73" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">AIF-C01 (900)</text>
  <rect x="880" y="54" width="90" height="30" rx="8" fill="#141824" />
  <text x="925" y="73" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">GCP-PMLE (500)</text>
  <rect x="980" y="54" width="80" height="30" rx="8" fill="#141824" />
  <text x="1020" y="73" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">watsonx (400)</text>

  <!-- Main Flashcard Stage -->
  <!-- Queue Status Bar -->
  <rect x="360" y="115" width="760" height="38" rx="10" fill="#141926" stroke="#252b3b" stroke-width="1" />
  <text x="380" y="139" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Session SRS du jour : <tspan fill="#60a5fa" font-weight="bold">Carte 4 sur 17</tspan></text>
  <!-- Progress pill -->
  <rect x="580" y="128" width="300" height="10" rx="5" fill="#0c101a" />
  <rect x="580" y="128" width="75" height="10" rx="5" fill="#3b82f6" />
  <text x="895" y="138" fill="#64748b" font-family="monospace" font-size="11">24%</text>
  <text x="975" y="139" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold">🔥 Série 14 jours</text>

  <!-- Big Interactive Flashcard (Verso Revealed) -->
  <g filter="url(#fc-shadow)">
    <rect x="360" y="170" width="760" height="380" rx="24" fill="url(#card-surface)" stroke="#3b82f6" stroke-width="1.5" />
    
    <!-- Card Header Info -->
    <rect x="385" y="190" width="85" height="24" rx="6" fill="#1e293b" />
    <text x="427" y="206" fill="#93c5fd" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">CARTE #127</text>
    
    <text x="485" y="206" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Domaine : <tspan fill="#ffffff" font-weight="bold">Sécurité &amp; Content Safety</tspan></text>
    
    <rect x="1000" y="190" width="95" height="24" rx="12" fill="#ef4444" fill-opacity="0.15" />
    <text x="1047" y="206" fill="#f87171" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">Difficulté 4/5</text>

    <!-- Question (Recto) -->
    <text x="385" y="250" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">QUESTION (RECTO) :</text>
    <text x="385" y="275" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Comment empêcher les attaques par injection de prompt indirecte dans Azure OpenAI</text>
    <text x="385" y="297" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">lorsque le modèle ingère des flux RSS externes et des emails de clients non vérifiés ?</text>

    <!-- Divider -->
    <line x1="385" y1="320" x2="1095" y2="320" stroke="#252b3b" stroke-width="1" />

    <!-- Answer (Verso) -->
    <text x="385" y="348" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">RÉPONSE CLÉ (VERSO) :</text>
    <text x="385" y="375" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">1. Activer <tspan fill="#ffffff" font-weight="bold">Azure AI Content Safety Prompt Shields</tspan> pour analyser spécifiquement les inputs indirects.</text>
    <text x="385" y="400" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">2. Configurer des <tspan fill="#ffffff" font-weight="bold">Regex Custom Blocklists</tspan> pour bloquer les patterns d'évasion (Jailbreaks system prompt).</text>
    <text x="385" y="425" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">3. Utiliser le balisage de délimiteur strict <tspan fill="#60a5fa" font-family="monospace">&lt;untrusted_input&gt;...&lt;/untrusted_input&gt;</tspan> dans le métaprompt.</text>

    <!-- Scientific SM-2 Metrics Footer -->
    <rect x="385" y="455" width="710" height="75" rx="12" fill="#0d111a" stroke="#1f2638" stroke-width="1" />
    <text x="405" y="480" fill="#64748b" font-family="monospace" font-size="10">MÉTRIQUES DE RÉTENTION SM-2 / FSRS :</text>
    <text x="405" y="502" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Répétitions réussies : <tspan fill="#34d399" font-weight="bold">3</tspan> • Facteur d'aisance (EF) : <tspan fill="#60a5fa" font-weight="bold">2.42</tspan> • Dernier rappel : <tspan fill="#ffffff">Il y a 3 jours</tspan></text>
    <text x="405" y="520" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Seuil critique d'oubli estimé : <tspan fill="#f59e0b" font-weight="bold">Aujourd'hui à 18h (Rappel impératif)</tspan></text>
  </g>

  <!-- 4 SM-2 Grading Buttons -->
  <!-- Button 1: À revoir (1j) -->
  <rect x="360" y="575" width="175" height="58" rx="14" fill="#4c0519" fill-opacity="0.3" stroke="#e11d48" stroke-width="1.5" />
  <text x="447" y="600" fill="#fb7185" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">1. À revoir</text>
  <text x="447" y="618" fill="#fda4af" font-family="monospace" font-size="11" text-anchor="middle">Intervalle : 1 jour</text>

  <!-- Button 2: Difficile (3j) -->
  <rect x="555" y="575" width="175" height="58" rx="14" fill="#451a03" fill-opacity="0.3" stroke="#d97706" stroke-width="1.5" />
  <text x="642" y="600" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">2. Difficile</text>
  <text x="642" y="618" fill="#fde68a" font-family="monospace" font-size="11" text-anchor="middle">Intervalle : 3 jours</text>

  <!-- Button 3: Bien (7j) -->
  <rect x="750" y="575" width="175" height="58" rx="14" fill="#064e3b" fill-opacity="0.3" stroke="#10b981" stroke-width="1.5" />
  <text x="837" y="600" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">3. Bien</text>
  <text x="837" y="618" fill="#a7f3d0" font-family="monospace" font-size="11" text-anchor="middle">Intervalle : 7 jours</text>

  <!-- Button 4: Facile (14j) -->
  <rect x="945" y="575" width="175" height="58" rx="14" fill="#1e3a8a" fill-opacity="0.3" stroke="#3b82f6" stroke-width="1.5" />
  <text x="1032" y="600" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">4. Facile</text>
  <text x="1032" y="618" fill="#bfdbfe" font-family="monospace" font-size="11" text-anchor="middle">Intervalle : 14 jours</text>

  <!-- Keyboard hints -->
  <text x="740" y="665" fill="#64748b" font-family="monospace" font-size="11" text-anchor="middle">Raccourcis clavier : Touche [Espace] pour retourner la carte • Chiffres [1] [2] [3] [4] pour noter</text>
</svg>
